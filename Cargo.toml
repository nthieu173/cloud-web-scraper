[package]
name = "cloud-web-scraper"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "tokio"] }
# Function URLs send API Gateway HTTP API (payload 2.0) events.
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http"] }
mime_guess = "2.0.5"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
ureq = "3.5.0"
url = "2.5.8"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Restriction lints are selected individually because some conflict. This set
# matches churchill and sherlock-13-ai.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
dbg_macro = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
doc_broken_link = "deny"
doc_include_without_cfg = "deny"
doc_link_with_quotes = "deny"
doc_markdown = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
filetype_is_file = "deny"
float_arithmetic = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
infinite_loop = "deny"
inline_trait_bounds = "deny"
large_include_file = "deny"
lossy_float_literal = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
modulo_arithmetic = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_collect = "deny"
needless_raw_strings = "deny"
non_zero_suggestions = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
pointer_format = "deny"
precedence_bits = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
str_to_string = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_rest_pattern = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
