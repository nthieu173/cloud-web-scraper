[package]
name = "cloud-web-scraper"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "tokio"] }
# Function URLs send API Gateway HTTP API (payload 2.0) events.
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http"] }
mime_guess = "2.0.5"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
ureq = "3.5.0"
url = "2.5.8"

[profile.release]
strip = true
lto = true
