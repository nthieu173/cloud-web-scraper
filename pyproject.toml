[project]
name = "cloud-web-scraper-dev"
version = "0.1.0"
description = "Development tools for the cloud-web-scraper repository"
requires-python = ">=3.14"
dependencies = []

# Release build tools (cargo-lambda, Zig) are pinned with hashes in
# build-requirements.txt instead, which `make bundle` and release CI share.
[dependency-groups]
dev = [
  "prek>=0.3,<1",
]

[tool.uv]
package = false
