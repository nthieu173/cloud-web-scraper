name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Repository gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match Cargo jobs to runner CPUs
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # rustup is preinstalled; rust-toolchain.toml selects the version.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-gate-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # cargo fmt --check, cargo clippy (-D warnings), cargo doc, cargo test and
      # node --test, all with --locked where Cargo takes it.
      - name: Run repository gate
        id: gate
        run: make gate
      - name: Show failed gate output
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: make gate-why
