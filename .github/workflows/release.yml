name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # Create the vX.Y.Z tag and its release.
    env:
      RUSTC_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled; rust-toolchain.toml selects the version.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Read version and check the release is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Releases are cut from main, not $GITHUB_REF." >&2
            exit 1
          fi
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cloud-web-scraper") | .version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml version must be MAJOR.MINOR.PATCH, not '$version'." >&2
            exit 1
          fi
          tag="v$version"
          # Captured before matching: grep -q exiting early would fail the pipe.
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if grep -qxF "refs/tags/$tag" <<< "$tags"; then
            echo "Tag $tag already exists; bump the version in Cargo.toml." >&2
            exit 1
          fi
          # Listing includes drafts, which need not have a tag yet.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if grep -qxF "$tag" <<< "$releases"; then
            echo "A release for $tag already exists; bump the version in Cargo.toml." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Match Cargo jobs to runner CPUs
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      # No caches here: a cache restored into a release can be written by any
      # branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No cache: a release builds only from what the lockfile pins.
          package-manager-cache: false
      - name: Run repository gate
        id: gate
        run: make gate
      - name: Show failed gate output
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: make gate-why
      # Installs build-requirements.txt into a venv with
      # `pip install --require-hashes --only-binary=:all:`, runs
      # `cargo lambda build --release --arm64 --output-format zip`, then packs
      # the deterministic tarball and its .sha256 (scripts/bundle.sh).
      - name: Build bundle
        run: make bundle
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            target/bundle/cloud-web-scraper.tar.gz \
            target/bundle/cloud-web-scraper.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Bundle for wiz-vm. SHA-256 of cloud-web-scraper.tar.gz: $(cut -d' ' -f1 target/bundle/cloud-web-scraper.tar.gz.sha256)"
      - name: Report bundle digest
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          sha256="$(cut -d' ' -f1 target/bundle/cloud-web-scraper.tar.gz.sha256)"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "### $TAG"
            echo
            echo "- Bundle: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/cloud-web-scraper.tar.gz"
            echo "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
